<svg xmlns="http://www.w3.org/2000/svg" width="756" height="110" viewBox="0 0 756 110"><rect width="756" height="110" fill="#ead8ad"/><rect width="756" height="24" fill="#143f2c"/><text x="14" y="18" font-family="Impact,Arial Narrow,sans-serif" font-size="16" fill="#f4e8c6">FROM THE PUZZLE DESK</text><text x="14" y="51" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#171812">WELCOME, SEWER SCHOLARS.</text><text x="14" y="72" font-family="Georgia,serif" font-size="11" fill="#171812">Five trials stand between you and enlightenment: bridges, numbers, pizza, deduction, and the courage to write in ink.</text><text x="14" y="93" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#8c2118">HOUSE RULE: ISSUE #1 ANSWERS ARRIVE IN ISSUE #2.  •  EDITOR: THE PUZZLE DOJO  •  THEME: BRIDGES &amp; TUNNELS</text><path d="M0 108H756" stroke="#171812" stroke-width="2"/></svg>
