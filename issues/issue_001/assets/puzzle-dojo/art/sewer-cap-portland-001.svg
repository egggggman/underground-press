  <text x="130" y="46" text-anchor="middle" font-family="Impact,Arial Narrow,sans-serif" font-size="23" fill="#f4e8c6">THIS WEEK'S SEWER CAP</text>
  <circle cx="130" cy="145" r="79" fill="#756b55" stroke="#17130f" stroke-width="7"/>
