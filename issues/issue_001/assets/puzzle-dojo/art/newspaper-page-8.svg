<svg xmlns="http://www.w3.org/2000/svg" width="792" height="1224" viewBox="0 0 792 1224" role="img" aria-labelledby="title desc">
  <title id="title">Page 8 newspaper underlay</title>
  <desc id="desc">A complete Underground Press newspaper page beneath the immutable Puzzle Dojo puzzle placements.</desc>
  <defs>
    <filter id="grain"><feTurbulence baseFrequency=".55" numOctaves="2" seed="8" type="fractalNoise"/><feColorMatrix values="0 0 0 0 0.20 0 0 0 0 0.16 0 0 0 0 0.10 0 0 0 .07 0"/></filter>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".6" fill="#173f32" opacity=".22"/></pattern>
  </defs>
  <rect width="792" height="1224" fill="#ead9ad"/>
  <rect width="792" height="1224" filter="url(#grain)" opacity=".26"/>
  <path d="M18 20h756v1184H18z" fill="none" stroke="#17130f" stroke-width="1"/>
  <path d="M20 80h752M20 1148h752" stroke="#17130f" stroke-width="2"/>
  <path d="M487 82v1060" stroke="#8c2118" stroke-width="1.5" opacity=".55"/>
  <g font-family="Arial,sans-serif" fill="#17130f">
    <text x="24" y="93" font-size="8" font-weight="700" letter-spacing="1.4">THE UNDERGROUND PRESS / PORTLAND BENEATH PORTLAND / ISSUE 001</text>
    <text x="768" y="93" text-anchor="end" font-size="8" font-weight="700">PUZZLE DESK / BETA PROOF</text>
  </g>
  <g transform="translate(488 86)">
    <rect width="282" height="140" fill="#173f32"/>
    <text x="14" y="28" font-family="Impact,Arial Narrow,sans-serif" font-size="22" fill="#f4e8c6">FROM THE PUZZLE DESK</text>
    <text x="14" y="54" font-family="Georgia,serif" font-size="11" fill="#fff5d8"><tspan x="14">Four trials share these pages with the neighborhood.</tspan><tspan x="14" dy="17">Pencil marks are welcome; spoilers are not.</tspan><tspan x="14" dy="17">Answers return with the next issue.</tspan></text>
    <text x="14" y="126" font-family="Courier New,monospace" font-size="8" font-weight="700" fill="#d4a92b">PASS THE PAPER LEFT WHEN FINISHED.</text>
  </g>
  <g transform="translate(488 236)">
    <path d="M0 0h282v108H0z" fill="#f3e3bc" stroke="#8c2118" stroke-width="2" stroke-dasharray="7 4"/>
    <text x="13" y="24" font-family="Impact,Arial Narrow,sans-serif" font-size="18" fill="#8c2118">NEIGHBORHOOD NOTICE</text>
    <text x="13" y="47" font-family="Georgia,serif" font-size="10"><tspan x="13">Loose chalk at the east stair has been boxed.</tspan><tspan x="13" dy="15">Borrow what you need. Return the sharp pieces.</tspan></text>
    <text x="13" y="94" font-family="Arial,sans-serif" font-size="8" font-weight="700">NO NAME SUBMITTED / POSTED NEAR THE GREEN DOOR</text>
  </g>
  <g transform="translate(488 354)">
    <rect width="282" height="116" fill="url(#dots)" stroke="#17130f" stroke-width="1.5"/>
    <text x="13" y="23" font-family="Impact,Arial Narrow,sans-serif" font-size="17" fill="#173f32">HARBOR WEATHER, MORE OR LESS</text>
    <text x="13" y="47" font-family="Georgia,serif" font-size="10"><tspan x="13">Patchy fog near the waterfront, thicker wherever</tspan><tspan x="13" dy="15">someone says it is lifting. Keep puzzle pages dry.</tspan></text>
    <text x="13" y="101" font-family="Courier New,monospace" font-size="8" font-weight="700" fill="#8c2118">FORECAST CONFIDENCE: FOLD YOUR OWN CORNER.</text>
  </g>
  <g transform="translate(270 860)">
    <rect width="228" height="124" fill="#173f32" stroke="#17130f" stroke-width="1.5"/>
    <text x="12" y="25" font-family="Impact,Arial Narrow,sans-serif" font-size="18" fill="#f4e8c6">HIDDEN SHURIKEN</text>
    <text x="12" y="47" font-family="Georgia,serif" font-size="8" fill="#fff5d8"><tspan x="12">One tiny mark hides in the furniture.</tspan><tspan x="12" dy="13">Circle it. Do not alert the gull.</tspan></text>
    <path d="M184 37l5 13 14-4-8 11 11 9-14-1-3 14-5-13-14 4 8-11-11-9 14 1z" fill="#d4a92b" stroke="#17130f"/>
    <text x="12" y="108" font-family="Courier New,monospace" font-size="7" font-weight="700" fill="#d4a92b">SECONDARY GAME / ONE MARK</text>
  </g>
</svg>
