  <text x="20" y="83" font-family="Arial,sans-serif" font-size="11" fill="#222">Find the places, people, businesses, and landmarks</text>
  <text x="20" y="98" font-family="Arial,sans-serif" font-size="11" fill="#222">that make our neighborhood feel like home.</text>
