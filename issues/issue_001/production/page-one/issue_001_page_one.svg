<svg xmlns="http://www.w3.org/2000/svg" width="11in" height="17in" viewBox="0 0 792 1224" role="img" aria-labelledby="title desc">
<title id="title">The Underground Press Issue 001 Page One</title>
<desc id="desc">Complete production proof for the Portland crime increase lead story.</desc>
<defs><filter id="paper"><feTurbulence baseFrequency=".52" numOctaves="3" seed="11" type="fractalNoise" result="n"/><feBlend in="SourceGraphic" in2="n" mode="multiply"/></filter><filter id="photo"><feColorMatrix type="saturate" values=".52"/><feComponentTransfer><feFuncR type="gamma" amplitude="1.05" exponent=".94" offset="0"/></feComponentTransfer></filter></defs>
<rect width="792" height="1224" fill="#eadcae"/><rect width="792" height="1224" fill="#8b7441" opacity=".08" filter="url(#paper)"/>
<rect x="14" y="10" width="764" height="27" fill="#8c241c"/>
<text x="25" y="31" font-family="Impact,'Arial Narrow',sans-serif" font-size="17" font-weight="bold" fill="#fff8df" text-anchor="start">FIRST EDITION!</text><text x="396" y="31" font-family="Impact,'Arial Narrow',sans-serif" font-size="16" font-weight="bold" fill="#fff8df" text-anchor="middle">PORTLAND&#x27;S MOST INDEPENDENT NEWSPAPER</text><text x="765" y="31" font-family="Impact,'Arial Narrow',sans-serif" font-size="20" font-weight="bold" fill="#fff8df" text-anchor="end">50¢</text><text x="24" y="112" font-family="Georgia,serif" font-size="39" font-weight="bold" fill="#17150f" text-anchor="start">The</text><text x="102" y="126" font-family="Impact,'Arial Narrow',sans-serif" font-size="68" font-weight="bold" fill="#17150f" text-anchor="start">UNDERGROUND PRESS</text><text x="396" y="153" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#17150f" text-anchor="middle">WE&#x27;RE ALL LOOKING FOR A PLACE TO LAND.</text><line x1="14" y1="166" x2="778" y2="166" stroke="#17150f" stroke-width="3"/><text x="18" y="181" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#17150f" text-anchor="start">VOL. 1, NO. 1</text><text x="396" y="181" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#17150f" text-anchor="middle">PUBLISHED BY NOBODY / CONTRIBUTORS EVERYBODY / APPROVED BY MYRTLE</text><text x="774" y="181" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#17150f" text-anchor="end">FIRST EDITION</text><rect x="14" y="190" width="150" height="88" fill="none" stroke="#17150f" stroke-width="1.5"/><rect x="14" y="190" width="150" height="24" fill="#17150f"/><text x="22" y="207" font-family="Impact,'Arial Narrow',sans-serif" font-size="12" font-weight="bold" fill="#fff8df" text-anchor="start">HARBOR WEATHER</text><text x="89.0" y="245" font-family="Impact,'Arial Narrow',sans-serif" font-size="16" font-weight="bold" fill="#8c241c" text-anchor="middle">FOG / LIGHT RAIN</text><text x="89.0" y="265" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#17150f" text-anchor="middle">LOW VISIBILITY BELOW</text><rect x="170" y="190" width="240" height="88" fill="none" stroke="#17150f" stroke-width="1.5"/><rect x="170" y="190" width="240" height="24" fill="#17150f"/><text x="178" y="207" font-family="Impact,'Arial Narrow',sans-serif" font-size="12" font-weight="bold" fill="#fff8df" text-anchor="start">NEIGHBORHOOD WATCH</text><text x="290.0" y="245" font-family="Impact,'Arial Narrow',sans-serif" font-size="16" font-weight="bold" fill="#8c241c" text-anchor="middle">3 REPORTS OVERNIGHT</text><text x="290.0" y="265" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#17150f" text-anchor="middle">VERIFY BEFORE REPEATING</text><rect x="416" y="190" width="184" height="88" fill="none" stroke="#17150f" stroke-width="1.5"/><rect x="416" y="190" width="184" height="24" fill="#17150f"/><text x="424" y="207" font-family="Impact,'Arial Narrow',sans-serif" font-size="12" font-weight="bold" fill="#fff8df" text-anchor="start">PRESS STATUS</text><text x="508.0" y="245" font-family="Impact,'Arial Narrow',sans-serif" font-size="16" font-weight="bold" fill="#8c241c" text-anchor="middle">FIRST RUN</text><text x="508.0" y="265" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#17150f" text-anchor="middle">MIND THE WET INK</text><rect x="608" y="190" width="170" height="176" fill="none" stroke="#17150f" stroke-width="2" stroke-dasharray="5 3"/><text x="693" y="213" font-family="Impact,'Arial Narrow',sans-serif" font-size="14" font-weight="bold" fill="#16452f" text-anchor="middle">THE CRUST BUCKET</text><text x="693" y="239" font-family="Impact,'Arial Narrow',sans-serif" font-size="20" font-weight="bold" fill="#8c241c" text-anchor="middle">MIDNIGHT SLICE</text><text x="693" y="260" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#17150f" text-anchor="middle">CLIP THIS BOX</text><text x="693" y="288" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#17150f" text-anchor="middle">2 SLICES + SODA</text><text x="693" y="309" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#17150f" text-anchor="middle">ROTATING ISSUE OFFER</text><text x="693" y="340" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#16452f" text-anchor="middle">PORTLAND BENEATH PORTLAND</text><path d="M655 325 L691 286 Q716 302 728 327 Z" fill="#d39e2b" stroke="#17150f" stroke-width="2"/><path d="M691 286 Q714 294 728 308" fill="none" stroke="#8c241c" stroke-width="8"/><circle cx="688" cy="312" r="4" fill="#8c241c"/><circle cx="708" cy="318" r="4" fill="#8c241c"/><text x="16" y="334" font-family="Impact,'Arial Narrow',sans-serif" font-size="50" font-weight="bold" fill="#17150f" text-anchor="start">CRIME CLIMBS AS</text><text x="16" y="385" font-family="Impact,'Arial Narrow',sans-serif" font-size="42" font-weight="bold" fill="#17150f" text-anchor="start">BLACK-CLAD CREWS MOVE BELOW</text><text x="18" y="411" font-family="Georgia,serif" font-size="15" font-weight="bold" fill="#17150f" text-anchor="start">Neighbors describe coordinated movement. The &#x27;Foot Clan&#x27; name remains rumor, not newsroom-confirmed fact.</text><image x="165" y="430" width="438" height="343" preserveAspectRatio="xMidYMid slice" href="../../assets/page-one/art/waterfront-night-watch-halftone-v2.png" filter="url(#photo)"/><rect x="165" y="430" width="438" height="343" fill="none" stroke="#17150f" stroke-width="2"/><text x="16" y="439" font-family="Impact,'Arial Narrow',sans-serif" font-size="12" font-weight="bold" fill="#8c241c" text-anchor="start">THE LOCAL ANGLE</text><text x="16" y="457" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">Calls logged across three</text><text x="16" y="468" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">below-street corridors have</text><text x="16" y="479" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">risen over the last two</text><text x="16" y="490" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">publication cycles, with</text><text x="16" y="501" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">residents describing thefts,</text><text x="16" y="512" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">damaged locks, and</text><text x="16" y="523" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">coordinated black-clad</text><text x="16" y="534" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">movement after midnight. No</text><text x="16" y="545" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">public source has identified</text><text x="16" y="556" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">a single group behind the</text><text x="16" y="567" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">incidents.</text><text x="16" y="610" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">Several neighbors used the</text><text x="16" y="621" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">name &#x27;Foot Clan.&#x27; The</text><text x="16" y="632" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">Underground Press has not</text><text x="16" y="643" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">confirmed that claim. What</text><text x="16" y="654" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">is confirmed: shopkeepers</text><text x="16" y="665" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">are closing in pairs,</text><text x="16" y="676" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">delivery routes are</text><text x="16" y="687" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">changing, and ordinary</text><text x="16" y="698" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">errands now take a little</text><text x="16" y="709" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">more planning.</text><text x="16" y="752" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#16452f" text-anchor="start">CONTINUED, PAGE 3</text><text x="169" y="786" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#17150f" text-anchor="start">Residents watch three unidentified figures near a waterfront service entrance after midnight.</text><text x="600" y="798" font-family="Arial,sans-serif" font-size="7" font-weight="bold" fill="#17150f" text-anchor="end">READER PHOTO / NAME WITHHELD</text><line x1="615" y1="382" x2="615" y2="796" stroke="#17150f" stroke-width="2"/><text x="627" y="407" font-family="Impact,'Arial Narrow',sans-serif" font-size="25" font-weight="bold" fill="#17150f" text-anchor="start">PIZZA SALES</text><text x="627" y="435" font-family="Impact,'Arial Narrow',sans-serif" font-size="25" font-weight="bold" fill="#17150f" text-anchor="start">SPIKE AFTER</text><text x="627" y="463" font-family="Impact,'Arial Narrow',sans-serif" font-size="25" font-weight="bold" fill="#8c241c" text-anchor="start">MIDNIGHT</text><text x="628" y="484" font-family="Georgia,serif" font-size="10" font-weight="bold" fill="#17150f" text-anchor="start">Late orders track the same corridors</text><text x="628" y="505" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">The Crust Bucket reports an</text><text x="628" y="516" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">unusual run of large late-</text><text x="628" y="527" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">night orders, paid in folded</text><text x="628" y="538" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">bills and collected without</text><text x="628" y="549" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">names. The shop calls it</text><text x="628" y="560" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">good business, not evidence.</text><text x="628" y="571" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">Delivery riders say the</text><text x="628" y="582" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">orders cluster near the same</text><text x="628" y="593" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">service passages named in</text><text x="628" y="604" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">neighborhood reports.</text><rect x="628" y="640" width="137" height="70" fill="#d39e2b" opacity=".72" stroke="#17150f"/><text x="697" y="660" font-family="Impact,'Arial Narrow',sans-serif" font-size="10" font-weight="bold" fill="#17150f" text-anchor="middle">OVERHEARD BY ALICE</text><text x="637" y="677" font-family="Georgia,serif" font-size="8" font-weight="normal" fill="#17150f" text-anchor="start">&#x27;Twelve pies. No onions.</text><text x="637" y="687" font-family="Georgia,serif" font-size="8" font-weight="normal" fill="#17150f" text-anchor="start">Nobody wanted a receipt.&#x27;</text><text x="637" y="697" font-family="Georgia,serif" font-size="8" font-weight="normal" fill="#17150f" text-anchor="start">Alice heard the order; she</text><text x="637" y="707" font-family="Georgia,serif" font-size="8" font-weight="normal" fill="#17150f" text-anchor="start">did not see who carried it.</text><text x="764" y="748" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#16452f" text-anchor="end">SEE SALES, PAGE 2</text><line x1="14" y1="812" x2="778" y2="812" stroke="#17150f" stroke-width="4"/><rect x="14" y="824" width="230" height="176" fill="none" stroke="#17150f" stroke-width="1.5"/><rect x="14" y="824" width="230" height="25" fill="#8c241c"/><text x="24" y="842" font-family="Impact,'Arial Narrow',sans-serif" font-size="14" font-weight="bold" fill="#fff8df" text-anchor="start">NEWS BRIEFS</text><rect x="252" y="824" width="250" height="176" fill="none" stroke="#17150f" stroke-width="1.5"/><rect x="252" y="824" width="250" height="25" fill="#16452f"/><text x="262" y="842" font-family="Impact,'Arial Narrow',sans-serif" font-size="14" font-weight="bold" fill="#fff8df" text-anchor="start">WHAT NEIGHBORS CAN DO</text><rect x="510" y="824" width="268" height="176" fill="none" stroke="#17150f" stroke-width="1.5"/><rect x="510" y="824" width="268" height="25" fill="#8c241c"/><text x="520" y="842" font-family="Impact,'Arial Narrow',sans-serif" font-size="14" font-weight="bold" fill="#fff8df" text-anchor="start">COMMUNITY CALENDAR</text><text x="24" y="865" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">LOCK CHECKS OFFERED - Volunteer repair</text><text x="24" y="877" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">crews will inspect shop latches. Page 2</text><text x="24" y="889" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">FERRY CART DELAYED - Fog slows the east</text><text x="24" y="901" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">delivery run. Page 2  MISSING CRATE</text><text x="24" y="913" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">RETURNED - Contents intact; note unsigned.</text><text x="24" y="925" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">Page 4</text><text x="265" y="866" font-family="Georgia,serif" font-size="10" font-weight="normal" fill="#17150f" text-anchor="start">Travel in pairs after late shifts. Record</text><text x="265" y="880" font-family="Georgia,serif" font-size="10" font-weight="normal" fill="#17150f" text-anchor="start">times and locations, not guesses. Report</text><text x="265" y="894" font-family="Georgia,serif" font-size="10" font-weight="normal" fill="#17150f" text-anchor="start">damaged locks. Do not follow unidentified</text><text x="265" y="908" font-family="Georgia,serif" font-size="10" font-weight="normal" fill="#17150f" text-anchor="start">groups into restricted corridors. Rumor</text><text x="265" y="922" font-family="Georgia,serif" font-size="10" font-weight="normal" fill="#17150f" text-anchor="start">is not a substitute for a witness.</text><text x="376" y="978" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#8c241c" text-anchor="middle">KEEP NOTES. KEEP EACH OTHER CLOSE.</text><text x="523" y="865" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">SAT - LOCK &amp; LANTERN CHECK, community room, 2 PM</text><text x="523" y="878" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">SUN - PAPERBACK SWAP, green-lamp corner, noon</text><text x="523" y="891" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">TUE - NIGHT ROUTE LISTENING SESSION, press drop,</text><text x="523" y="904" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">7 PM  THU - CRIBBAGE &amp; COFFEE, Great Lost Bear, 6</text><text x="523" y="917" font-family="Georgia,serif" font-size="9" font-weight="normal" fill="#17150f" text-anchor="start">PM</text><rect x="14" y="1010" width="190" height="151" fill="#17150f"/><text x="28" y="1042" font-family="Impact,'Arial Narrow',sans-serif" font-size="28" font-weight="bold" fill="#fff8df" text-anchor="start">INSIDE</text><text x="28" y="1073" font-family="Impact,'Arial Narrow',sans-serif" font-size="28" font-weight="bold" fill="#fff8df" text-anchor="start">THIS ISSUE</text><text x="218" y="1032" font-family="Georgia,serif" font-size="10" font-weight="bold" fill="#17150f" text-anchor="start">City Beat ................................ 2</text><text x="218" y="1050" font-family="Georgia,serif" font-size="10" font-weight="bold" fill="#17150f" text-anchor="start">Crime &amp; Neighborhood Watch ............. 3</text><text x="218" y="1068" font-family="Georgia,serif" font-size="10" font-weight="bold" fill="#17150f" text-anchor="start">Editorial ............................... 4</text><text x="218" y="1086" font-family="Georgia,serif" font-size="10" font-weight="bold" fill="#17150f" text-anchor="start">Community / Classifieds ................. 7</text><text x="218" y="1104" font-family="Georgia,serif" font-size="10" font-weight="bold" fill="#17150f" text-anchor="start">Puzzle Dojo ........................... 8-9</text><rect x="510" y="1010" width="268" height="151" fill="#16452f" stroke="#17150f" stroke-width="2"/><text x="644" y="1038" font-family="Impact,'Arial Narrow',sans-serif" font-size="25" font-weight="bold" fill="#fff8df" text-anchor="middle">THE CRUST BUCKET</text><text x="644" y="1070" font-family="Georgia,serif" font-size="17" font-weight="bold" fill="#fff8df" text-anchor="middle">HOT PIE. FAIR DEAL.</text><text x="644" y="1100" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#fff8df" text-anchor="middle">BRING THIS PAGE FOR THE</text><text x="644" y="1124" font-family="Impact,'Arial Narrow',sans-serif" font-size="14" font-weight="bold" fill="#d39e2b" text-anchor="middle">ISSUE 001 COUNTER SPECIAL</text><text x="644" y="1147" font-family="Arial,sans-serif" font-size="8" font-weight="normal" fill="#fff8df" text-anchor="middle">Offer terms posted at the counter.</text><rect x="14" y="1171" width="764" height="35" fill="#8c241c"/><text x="396" y="1195" font-family="Impact,'Arial Narrow',sans-serif" font-size="15" font-weight="bold" fill="#fff8df" text-anchor="middle">NEXT ISSUE: WHO KEEPS LEAVING THE HARBOR LIGHT ON?</text><text x="396" y="1218" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#17150f" text-anchor="middle">© THE UNDERGROUND PRESS  •  PORTLAND BENEATH PORTLAND  •  PASS IT ON</text></svg>