<svg xmlns="http://www.w3.org/2000/svg" width="476" height="204" viewBox="0 0 476 204" role="img"><title>Portland memory fragment</title><rect x="2" y="2" width="472" height="200" fill="none" stroke="#171812" stroke-width="3"/><rect x="7" y="7" width="462" height="190" fill="none" stroke="#171812" stroke-width="0.8"/><path d="M20 22l436-8 2 168-434 6z" fill="#fff6dc" fill-opacity=".55" stroke="#171812" stroke-width="1.4" stroke-dasharray="7 4"/><rect x="20" y="22" width="436" height="26" fill="#8c2118" transform="rotate(-1 20 22)"/><text x="34" y="41" font-family="Impact,Haettenschweiler,'Arial Narrow Bold','Liberation Sans Narrow',sans-serif" font-size="15" fill="#f4e8c6" letter-spacing=".8" textLength="300" lengthAdjust="spacingAndGlyphs" transform="rotate(-1 20 22)">PORTLAND MEMORY • HEARD NEAR THE STAIRS</text><text font-family="Georgia,'Times New Roman',serif" font-size="18" font-style="italic" fill="#171812"><tspan x="34" y="84">“On wet mornings, the first puzzle copy always</tspan><tspan x="34" y="108">curled at the harbor-facing corner.”</tspan></text><path d="M34 124H346" stroke="#171812" stroke-width="1"/><text font-family="'Arial Narrow',Arial,Helvetica,sans-serif" font-size="12" fill="#171812"><tspan x="34" y="146">A neighborhood recollection, not a historical claim.</tspan><tspan x="34" y="164">The teller's name was lost under a coffee ring.</tspan></text><circle cx="408" cy="140" r="29" fill="none" stroke="#6b4a2a" stroke-width="5" opacity=".38"/><circle cx="410" cy="141" r="25" fill="none" stroke="#6b4a2a" stroke-width="1.6" opacity=".3"/></svg>
