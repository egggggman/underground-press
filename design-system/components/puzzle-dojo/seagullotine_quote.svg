<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 200" role="img"><title>Seagullotine quote</title><rect width="370" height="200" rx="5" fill="#f0dfb6" stroke="#17130f" stroke-width="4"/><path d="M0 0h370v42H0z" fill="#9d2b22"/><text x="20" y="29" fill="#f6e9c5" font-family="Arial" font-size="18" font-weight="700">SEAGULLOTINE SAYS</text><text x="24" y="78" fill="#17130f" font-family="Georgia" font-size="17" font-style="italic"><tspan x="24">“A blank square isn't empty.</tspan><tspan x="24" dy="25">It's waiting for you to make</tspan><tspan x="24" dy="25">the first move.”</tspan></text><path d="M25 165q40-24 80 0t80 0" fill="none" stroke="#173f32" stroke-width="3"/><text x="228" y="178" font-family="Courier New" font-size="11" fill="#173f32">CLIPPED FOR LATER</text></svg>
