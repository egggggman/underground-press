<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 204" role="img"><title>Last Issue Solutions</title><rect width="260" height="204" fill="#ead9ad" stroke="#17130f" stroke-width="4"/><path d="M0 0h260v42H0z" fill="#9d2b22"/><text x="14" y="28" fill="#f6e9c5" font-family="Arial" font-size="18" font-weight="700">LAST ISSUE SOLUTIONS</text><text x="18" y="78" font-family="Georgia" font-size="15"><tspan x="18">Issue #1 opens the dojo.</tspan><tspan x="18" dy="23">There is no prior answer key.</tspan><tspan x="18" dy="31">Issue #1 solutions return</tspan><tspan x="18" dy="23">with Issue #2.</tspan></text><path d="M18 166h224" stroke="#173f32" stroke-dasharray="4 4"/><text x="18" y="188" font-family="Courier New" font-size="10" font-weight="700">CLIP • SAVE • CHECK NEXT TIME</text></svg>
