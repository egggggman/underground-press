<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 248" role="img"><title>Two mini advertisements</title><rect width="260" height="248" fill="#ead9ad" stroke="#17130f" stroke-width="4"/><g transform="translate(12 12)"><rect width="236" height="102" fill="#f3e3bc" stroke="#9d2b22" stroke-width="3" stroke-dasharray="7 4"/><text x="12" y="28" font-family="Arial" font-size="18" font-weight="700" fill="#9d2b22">THE CRUST BUCKET</text><text x="12" y="52" font-family="Georgia" font-size="13"><tspan x="12">Hot pie. Rotating coupons.</tspan><tspan x="12" dy="19">Clip this space for luck.</tspan></text><text x="12" y="91" font-family="Courier New" font-size="10" font-weight="700">ADVERTISEMENT • CLIP &amp; SAVE</text></g><g transform="translate(12 134)"><rect width="236" height="102" fill="#173f32" stroke="#17130f" stroke-width="3"/><text x="12" y="28" font-family="Arial" font-size="18" font-weight="700" fill="#f3e3bc">TONY'S DONUTS</text><text x="12" y="52" font-family="Georgia" font-size="13" fill="#fff5d8"><tspan x="12">Morning boxes. Warm coffee.</tspan><tspan x="12" dy="19">Special changes with the case.</tspan></text><text x="12" y="91" font-family="Courier New" font-size="10" font-weight="700" fill="#f3e3bc">ADVERTISEMENT • OPEN MORNINGS</text></g></svg>
