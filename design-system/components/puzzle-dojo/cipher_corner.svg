<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 258" role="img"><title>Cipher Corner</title><rect width="260" height="258" fill="#efdfb8" stroke="#17130f" stroke-width="4"/><path d="M0 0h260v42H0z" fill="#173f32"/><text x="16" y="28" fill="#f5e8c4" font-family="Arial" font-size="19" font-weight="700">CIPHER CORNER</text><text x="18" y="74" font-family="Georgia" font-size="14"><tspan x="18">Pizza Cipher uses a</tspan><tspan x="18" dy="20">Caesar shift of three.</tspan><tspan x="18" dy="28">Move each coded letter</tspan><tspan x="18" dy="20">three slices backward.</tspan></text><text x="24" y="182" font-family="Courier New" font-size="19" font-weight="700" fill="#9d2b22">S → P   K → H</text><circle cx="198" cy="210" r="28" fill="none" stroke="#17130f" stroke-width="3"/><path d="M198 185v50M173 210h50" stroke="#17130f"/><text x="18" y="238" font-family="Arial" font-size="10" font-weight="700">KEEP SPACES. CHECK THE WHOLE PHRASE.</text></svg>
