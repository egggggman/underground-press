<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 476 204" role="img"><title>Portland memory fragment</title><rect width="476" height="204" fill="#eee0b8" stroke="#17130f" stroke-width="4"/><path d="M15 18l446-7 2 177-442 4z" fill="#f5e8c5" stroke="#8d8068" stroke-width="2"/><text x="34" y="48" font-family="Courier New" font-size="12" font-weight="700" fill="#9d2b22">PORTLAND MEMORY • HEARD NEAR THE STAIRS</text><text x="34" y="82" font-family="Georgia" font-size="17" font-style="italic"><tspan x="34">“On wet mornings, the first puzzle copy always</tspan><tspan x="34" dy="25">curled at the harbor-facing corner.”</tspan></text><text x="34" y="144" font-family="Arial" font-size="11"><tspan x="34">A neighborhood recollection, not a historical claim.</tspan><tspan x="34" dy="18">The teller's name was lost under a coffee ring.</tspan></text><circle cx="412" cy="145" r="28" fill="none" stroke="#9d2b22" stroke-width="5" opacity=".55"/></svg>
