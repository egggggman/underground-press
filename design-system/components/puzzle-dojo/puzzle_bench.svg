<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 476 258" role="img"><title>Puzzle Bench</title><rect width="476" height="258" fill="#ead9ad" stroke="#17130f" stroke-width="4"/><path d="M0 0h476v43H0z" fill="#173f32"/><text x="20" y="29" fill="#f4e6bd" font-family="Arial" font-size="21" font-weight="700">PUZZLE BENCH</text><text x="24" y="77" font-family="Georgia" font-size="16" fill="#17130f"><tspan x="24">Sharpen a pencil. Trade a clue. Leave the bench</tspan><tspan x="24" dy="23">ready for the next solver.</tspan></text><path d="M24 129h428M24 174h428" stroke="#8d8068" stroke-dasharray="7 5"/><text x="25" y="151" font-family="Courier New" font-size="13">NAME __________________  TIME __________</text><text x="25" y="196" font-family="Courier New" font-size="13">STUCK ON _______________________________</text><path d="M344 208l86 0" stroke="#9d2b22" stroke-width="8"/><text x="24" y="236" font-family="Arial" font-size="11" font-weight="700" fill="#9d2b22">PASS THE PAPER. KEEP THE ANSWERS COVERED.</text></svg>
