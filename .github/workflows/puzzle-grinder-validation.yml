name: Puzzle Grinder Validation

on:
  pull_request:
    paths:
      - "tools/puzzle_grinder.py"
      - "tests/test_puzzle_grinder.py"
      - "prototypes/puzzle-grinder-v0.2/**"
      # Grinder inputs only (grinder_contract.json reads the top-level puzzle
      # SVG/JSON). The art/ subfolder (ad and furniture art) is not an input.
      - "issues/issue_001/assets/puzzle-dojo/*.svg"
      - "issues/issue_001/assets/puzzle-dojo/*.json"
      - ".github/workflows/puzzle-grinder-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The generator and its tests land together (PR #18). Until they exist on
      # the base, there is nothing to run, so skip only the grinder steps and say
      # so. If exactly one of the two exists, that is a broken checkout: fail.
      # Once both exist, every grinder step is mandatory.
      - name: Detect Puzzle Grinder
        id: grinder
        run: |
          gen=false; tst=false
          [ -f tools/puzzle_grinder.py ] && gen=true
          [ -f tests/test_puzzle_grinder.py ] && tst=true
          if [ "$gen" != "$tst" ]; then
            echo "::error::Puzzle Grinder is half-present (generator=$gen, tests=$tst)"
            exit 1
          fi
          echo "present=$gen" >> "$GITHUB_OUTPUT"
          if [ "$gen" = "false" ]; then
            echo "::warning::tools/puzzle_grinder.py is not on this branch yet; Puzzle Grinder checks skipped. Structural validation below still runs."
          fi
      - name: Compile generator and tests
        if: steps.grinder.outputs.present == 'true'
        run: python -m py_compile tools/puzzle_grinder.py tests/test_puzzle_grinder.py
      - name: Run Puzzle Grinder tests
        if: steps.grinder.outputs.present == 'true'
        run: python -m unittest tests.test_puzzle_grinder -v
      - name: Generate calibration proofs
        if: steps.grinder.outputs.present == 'true'
        run: python tools/puzzle_grinder.py --output /tmp/puzzle-grinder-proofs
      - name: Parse generated SVG proofs
        if: steps.grinder.outputs.present == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          proofs = sorted(Path("/tmp/puzzle-grinder-proofs").glob("*.svg"))
          assert len(proofs) == 13, len(proofs)
          for proof in proofs:
              ET.parse(proof)
          print(f"parsed {len(proofs)} SVG proofs")
          PY
      - name: Repository validation
        run: python tools/validate_repo.py
