name: Standalone GUI workspace validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  standalone-validation:
    name: Standalone build, typecheck, and sandbox tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui-workspace
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: gui-workspace/pnpm-lock.yaml
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build
        run: pnpm run build
      - name: Typecheck
        run: pnpm run typecheck
      - name: Sandbox tests
        run: pnpm run test:sandbox
